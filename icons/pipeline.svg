  pipeline — drawn for masen, dedicated to the public domain (CC0 1.0).

  A straight pipe with two flange collars and a valve wheel on a stem. Neither
  Maki nor Temaki carries one: Temaki's `pipe` is a tobacco pipe. Drawn to
  Maki's 15x15 grid and weight so a map using all three sets shows one house
  style. The elbow-with-flanges alternative read as the letter L at pin size.
-->
