<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>masen</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header class="bar">
      <h1><a href="https://danielefrisanco.github.io/masen">masen</a></h1>
      <p class="tagline">A region and a stylesheet, as a standalone SVG map.</p>
      <nav class="by">
        <!-- All three leave the tool, so all three open beside it: someone in
             the middle of building a map should not lose it to a click on a
             byline. `noopener` because a new tab gets a handle back otherwise.
             The gallery is a sibling file on this same site, so the link is
             relative — it works from the built site and from a local preview
             without either knowing what it is deployed under. -->
        <a href="./gallery.html" target="_blank" rel="noopener">Gallery</a>
        <a href="https://danielefrisanco.github.io/" rel="me noopener" target="_blank">Daniele Frisanco</a>
        <a href="https://github.com/danielefrisanco/masen" rel="noopener" target="_blank">Source</a>
      </nav>
    </header>

    <div class="layout">
      <!-- Rebuilt from the config on every change. Empty here: a form written
           twice, once in markup and once in code, is a form that drifts. -->
      <form id="form" class="panel" autocomplete="off"></form>

      <main class="stage">
        <!-- Focusable, because since 09d this is the tool's main input surface
             and it was reachable only with a mouse. The label says what the
             keys do, since there is nothing on screen to read until the cross
             appears. -->
        <figure
          id="map"
          class="map"
          aria-busy="true"
          tabindex="0"
          aria-label="The map. With a gesture chosen under Marks, the arrow keys move a cross and Enter places a mark."
        ></figure>
        <!-- The row under the map: how long it took, and the two readouts that
             belong to this screen rather than to the document. The zoom sat
             above the map until it was pointed out that it reads better beside
             the draw time — both are facts about the preview, not about the
             map, and neither belongs in the form. -->
        <div class="under">
          <p id="status" class="status" role="status">Loading the map data…</p>
          <div class="preview">
            <label class="field-hint" for="zoom">Preview</label>
            <select id="zoom">
              <option value="fit">Fit the column</option>
              <option value="1">100% — true size</option>
              <option value="0.5">50%</option>
              <option value="2">200%</option>
            </select>
            <!-- Where the pointer is, in the units every mark is stored in. Beside
                 the map rather than on it: a coordinate that follows the cursor
                 covers the thing being pointed at. -->
            <output id="where" class="where" for="map"></output>
          </div>
        </div>
        <label class="share">
          <span class="field-label">Link to this map</span>
          <input id="share" type="text" readonly spellcheck="false" />
        </label>
        <!-- Actions rather than options, so they live beside the map instead of
             in the form: nothing here changes what is drawn. -->
        <div class="export">
          <button id="save-svg" type="button" class="action" disabled>Download SVG</button>
          <button id="save-png" type="button" class="action" disabled>Download PNG</button>
          <span class="export-size">
            <label class="field-hint" for="export-scale">PNG size</label>
            <select id="export-scale"></select>
          </span>
          <span class="field-hint">The SVG is vector and has no size of its own.</span>
          <!-- The way out of a restored map. Without it a bare address always
               reopens the last one, and there is no way back to an empty
               page. -->
          <button id="start-over" type="button" class="action">Start over</button>
          <!-- Beside the downloads because that is where somebody stands when
               they have just finished a map and noticed what was missing from
               it — and because the map's own link is what the message carries,
               which only makes sense next to the map. -->
          <button id="feedback" type="button" class="action">Feedback</button>
        </div>
      </main>
    </div>

    <!-- Natural Earth asks for nothing: everything here is public domain, which
         is the property the whole project was built around. One line, because a
         footnote that needs a paragraph is not a footnote — and the mechanism
         rather than the example, so a map of Chile does not open by mentioning
         Crimea. The specifics live in the README, where somebody deciding
         whether to trust this will actually look. -->
    <footer class="colophon">
      <p>
        Data from
        <a href="https://www.naturalearthdata.com/" target="_blank" rel="noopener">Natural Earth</a>
        — public domain, no attribution required. Contested borders are hatched, not resolved.
      </p>
    </footer>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
